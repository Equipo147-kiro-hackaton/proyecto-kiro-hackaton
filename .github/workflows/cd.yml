name: CD — Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate 1: All tests must pass
  test:
    name: Quality Gate — Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run all tests
        run: npx vitest --run --coverage

      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(npx vitest --run --coverage --reporter=json 2>/dev/null | tail -1 || echo '{}')
          echo "Tests passed — coverage report generated"

  # Gate 2: Build must succeed
  build:
    name: Quality Gate — Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # Gate 3: Security scan
  security:
    name: Quality Gate — Security
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci

      - name: Audit for critical vulnerabilities
        run: |
          AUDIT=$(npm audit --json 2>/dev/null || true)
          CRITICAL=$(echo "$AUDIT" | jq '.metadata.vulnerabilities.critical // 0')
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Blocking deploy: $CRITICAL critical vulnerabilities found"
            exit 1
          fi

  # Gate 4: Deploy Lambda functions
  deploy-lambdas:
    name: Deploy — Lambdas
    needs: [build, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Compile Lambdas
        run: npx tsc --project lambda/tsconfig.json

      - name: Deploy CloudFormation stacks
        run: |
          echo "Validating templates..."
          aws cloudformation validate-template --template-body file://infra/cloudformation/dynamodb.yml
          aws cloudformation validate-template --template-body file://infra/cloudformation/lambda-role.yml
          aws cloudformation validate-template --template-body file://infra/cloudformation/api-gateway.yml
          echo "Templates valid — deploy via Amplify pipeline"

  # Gate 5: Amplify deploys frontend automatically on push to main
  verify-deployment:
    name: Verify — Amplify Deploy
    needs: [deploy-lambdas]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Amplify deployment triggered
        run: |
          echo "Amplify auto-deploys from main branch"
          echo "Frontend deployment triggered via amplify.yml build spec"
          echo "Verify at: https://console.aws.amazon.com/amplify/"

      - name: Post-deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Security:** No critical vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambdas:** Compiled and validated" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** Amplify auto-deploy triggered" >> $GITHUB_STEP_SUMMARY
